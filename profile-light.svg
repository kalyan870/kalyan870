<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="610" viewBox="0 0 1180 610" role="img" aria-labelledby="title desc">
  <title id="title">Kalyan Saragadam — AI engineering profile</title>
  <desc id="desc">A light terminal-inspired profile banner highlighting Kalyan's work in generative AI, retrieval systems, agents, multimodal AI, and full-stack development.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffffff"/><stop offset=".55" stop-color="#f2f7ff"/><stop offset="1" stop-color="#eafaf8"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#7c3aed"/><stop offset=".52" stop-color="#0891b2"/><stop offset="1" stop-color="#059669"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#06b6d4" stop-opacity=".15"/><stop offset="1" stop-color="#06b6d4" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#55708f" stroke-opacity=".075" stroke-width="1"/></pattern>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="portraitClip"><rect x="92" y="145" width="276" height="184" rx="14"/></clipPath>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#ffffff" stop-opacity=".96"/><stop offset="1" stop-color="#f7fbff" stop-opacity=".96"/></linearGradient>
